plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.13'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.factcheck'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
	maven { url 'https://jitpack.io' }
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// Jsoup (URL 크롤링)
	implementation 'org.jsoup:jsoup:1.18.1'

	// Tess4J (OCR)
	implementation 'net.sourceforge.tess4j:tess4j:5.13.0'

	// Komoran (한국어 형태소 분석)
	implementation 'com.github.shin285:KOMORAN:3.3.4'

	// Swagger
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'

	// Cache (Caffeine)
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'com.github.ben-manes.caffeine:caffeine'

	// Monitoring (Actuator + Prometheus) — Phase 1
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'io.micrometer:micrometer-registry-prometheus'

	// 구조화 로깅(JSON) — Loki 수집용
	implementation 'net.logstash.logback:logstash-logback-encoder:8.0'


	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	// 테스트는 H2 인메모리로 격리한다. 운영 프로파일은 MySQL + ddl-auto: create 라
	// 테스트가 로컬 스키마를 드롭·재생성하는 사고를 막기 위함(application-test.yaml).
	testRuntimeOnly 'com.h2database:h2'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.named('bootRun') {
	jvmArgs = ['-Djna.library.path=/opt/homebrew/lib']
}
