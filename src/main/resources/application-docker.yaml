spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 30 → 15 축소(Phase 3): 30은 Phase 8 이전 커넥션 고갈을 풀 확대로 땜질하던 값.
      # 트랜잭션 경계 정리 후 실측(2026-07-11, JMeter 500명)에서 active 최대 9 — 15면 충분하고
      # 유휴 커넥션만큼 백엔드 스레드·MySQL 세션 메모리를 아낀다(t2.micro 동거 환경).
      maximum-pool-size: 15
      minimum-idle: 5
      connection-timeout: 5000
      idle-timeout: 600000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  tomcat:
    threads:
      max: 200
      min-spare: 20
    accept-count: 100

ai:
  server:
    url: ${AI_ENGINE_URL:http://ai-engine:5000}
  youtube:
    analysis-url: ${YOUTUBE_AI_ANALYSIS_URL:http://youtube-ai:8000/analyze/youtube}

ocr:
  tessdata-path: /usr/share/tesseract-ocr/4.00/tessdata
  language: kor+eng

clova:
  ocr:
    api-url: ${CLOVA_OCR_API_URL:}
    secret-key: ${CLOVA_OCR_SECRET_KEY:}

openai:
  api-key: ${OPENAI_API_KEY:}

youtube:
  api:
    key: ${YOUTUBE_API_KEY:}

naver:
  api:
    client-id: ${NAVER_CLIENT_ID:}
    client-secret: ${NAVER_CLIENT_SECRET:}
