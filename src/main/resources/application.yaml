spring:
  application:
    name: factcheck

  datasource:
    url: jdbc:mysql://localhost:3306/factcheck?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: 8080

# Actuator / Prometheus (Phase 1 모니터링)
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # p95/p99 산출용 히스토그램 버킷 (Grafana에서 histogram_quantile 사용)
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms, 300ms, 500ms, 1s, 3s, 5s, 10s
  prometheus:
    metrics:
      export:
        enabled: true

# Swagger UI
springdoc:
  swagger-ui:
    path: /swagger-ui/index.html

# OCR 설정
ocr:
  tessdata-path: /opt/homebrew/share/tessdata
  language: kor+eng

# Clova OCR fallback 설정
clova:
  ocr:
    api-url: ${CLOVA_OCR_API_URL:}
    secret-key: ${CLOVA_OCR_SECRET_KEY:}

# OpenAI Vision OCR fallback 설정
openai:
  api-key: ${OPENAI_API_KEY:}

youtube:
  api:
    key: ${YOUTUBE_API_KEY:}

naver:
  api:
    client-id: ${NAVER_CLIENT_ID:}
    client-secret: ${NAVER_CLIENT_SECRET:}

ai:
  server:
    url: http://localhost:5000
  youtube:
    analysis-url: ${YOUTUBE_AI_ANALYSIS_URL:http://localhost:8000/analyze/youtube}
