global:
  scrape_interval: 15s

scrape_configs:
  # Spring Boot 백엔드 (actuator/micrometer 지표)
  - job_name: 'backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['newslens-backend:8080']

  # AI 엔진 FastAPI (prometheus-fastapi-instrumentator + 커스텀 게이지)
  # ai_active_analyses / ai_analyses_waiting 로 세마포어 백프레셔 관측
  - job_name: 'ai-engine'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['newslens-ai-engine:5000']
