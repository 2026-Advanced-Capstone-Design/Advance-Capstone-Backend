# Prometheus 스크랩 설정 — 각 대상의 지표 노출 주소를 주기적으로 긁어온다.
global:
  scrape_interval: 15s        # 15초마다 수집
  evaluation_interval: 15s
  external_labels:
    monitor: newslens

scrape_configs:
  # 1) Spring Boot 백엔드 — actuator/micrometer 가 노출하는 지표
  - job_name: 'backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['backend:8080']
        labels:
          service: 'backend'

  # 2) 호스트 자원(메모리/CPU/디스크)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # 3) 컨테이너별 자원 사용량
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # 4) Prometheus 자기 자신
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 5) (Phase 2 예정) AI 엔진 FastAPI 계측
  # - job_name: 'ai-engine'
  #   metrics_path: '/metrics'
  #   static_configs:
  #     - targets: ['ai-engine:5000']
