# /var/lib/grafana/dashboards 폴더의 대시보드 JSON을 자동 로드한다.
# (compose에서 ./grafana/dashboards 를 그 경로로 마운트)
apiVersion: 1

providers:
  - name: 'newslens'
    orgId: 1
    folder: 'NewsLens'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
