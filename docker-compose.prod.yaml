services:
  mysql:
    image: mysql:8.0
    container_name: newslens-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root1234}
      MYSQL_DATABASE: newslens
      MYSQL_USER: newslensd
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-newslens1234}
      TZ: Asia/Seoul
    volumes:
      - mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    # Phase 3: 갓 기동한 MySQL 8 실측 ~370MiB(버퍼풀 128M + 오버헤드) — 400m은 91%라 위험, 512m로.
    # (22시간 운영 후 120MiB 관측은 유휴 페이지가 스왑으로 빠진 값이었음 — 재시작 직후 기준으로 산정)
    mem_limit: 512m
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - newslens-network

  backend:
    image: jaewon0009/newslens-backend:latest
    container_name: newslens-backend
    # Phase 3 메모리 제한: 실측(2026-07-12, docker stats) 621MiB — 상한 없는 JVM은 계속 자란다.
    # mem_limit 768m + MaxRAMPercentage 60% → 힙 ≈460m로 컨테이너 상한 안에서 GC가 돌게 강제.
    mem_limit: 768m
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60.0"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/newslens?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      SPRING_DATASOURCE_USERNAME: newslens
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-newslens1234}
      AI_ENGINE_URL: http://ai-engine:5000
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      YOUTUBE_AI_ANALYSIS_URL: http://youtube-ai:8000/analyze/youtube
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - newslens-network

  frontend:
    image: jaewon0009/newslens-frontend:latest
    container_name: newslens-frontend
    # Phase 3: nginx 정적 서빙, 실측 4MiB.
    mem_limit: 64m
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - newslens-network

  redis:
    image: redis:7-alpine
    container_name: newslens-redis
    # 태스크 저장소 전용(캐시성) — 영속성 off, 메모리 상한 + 초과 시 오래된 것부터 제거.
    # EC2 메모리 예산 보호: maxmemory 128mb, 컨테이너 자체 상한 160m.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    mem_limit: 160m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - newslens-network

  ai-engine:
    image: jaewon0009/newslens-ai-engine:latest
    container_name: newslens-ai-engine
    # 워커 수 토글: 운영 기본 2, 세마포어 데모는 GUNICORN_WORKERS=1 (게이지 정확도).
    command: ["gunicorn","app:app","-k","uvicorn.workers.UvicornWorker","--bind","0.0.0.0:5000","--workers","${GUNICORN_WORKERS:-2}","--timeout","120"]
    # Phase 3: 실측 128MiB(워커 2). LLM 호출은 I/O 바운드라 메모리 증가 요인 적음.
    mem_limit: 384m
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      SPRING_CALLBACK_URL: http://backend:8080/api/v1/internal/callback
      REDIS_URL: redis://redis:6379/0
      MOCK_MODE: ${MOCK_MODE:-false}
      # 세마포어 백프레셔 튜닝/시연용(env로 토글). before=1000(무제한), after=5.
      MAX_CONCURRENT_ANALYSES: ${MAX_CONCURRENT_ANALYSES:-5}
      # MOCK 파이프라인 인위 지연(초) — 동시 실행 관측용. 운영 기본 0.
      MOCK_DELAY_SECONDS: ${MOCK_DELAY_SECONDS:-0}
    ports:
      - "5000:5000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - newslens-network

  youtube-ai:
    image: jaewon0009/newslens-youtube-ai:latest
    container_name: newslens-youtube-ai
    # Phase 3: 실측 28MiB.
    mem_limit: 256m
    environment:
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    ports:
      - "8000:8000"
    networks:
      - newslens-network

volumes:
  mysql-data:

networks:
  newslens-network:
    driver: bridge
